[project]
name = "gapcheck"
version = "0.0.1"
description = "Counterfactual record-edit evaluation of a statin care-gap agent on synthetic patients (2026 ACC/AHA guideline, PREVENT)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "duckdb==2.0.0",
    "pandas==3.1.1",
    "numpy==2.5.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pyprevent==0.1.7",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gapcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
